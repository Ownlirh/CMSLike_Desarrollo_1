<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{comun :: cabecera('Aviso')}"></head>
<body>
<main class="contenedor">
    <section class="tarjeta">
        <h1 th:text="${tituloError != null ? tituloError : 'Aviso del sistema'}">Aviso del sistema</h1>
        <p class="error" role="alert" th:text="${mensaje != null ? mensaje : 'No se pudo completar la acción.'}"></p>
        <div class="acciones-inline" style="margin-top: 1rem;">
            <a class="boton" th:href="@{/admin/DashBoardAdminCMSPanel}">Ir al panel</a>
            <a class="boton secundario" href="/">Ir al inicio</a>
        </div>
    </section>
</main>
</body>
</html>
