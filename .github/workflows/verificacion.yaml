name: Verificación Maven

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  h2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B -ntp clean verify

  postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: cms_pruebas
          POSTGRES_USER: cms
          POSTGRES_PASSWORD: cms_pruebas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cms -d cms_pruebas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CMS_TEST_DB_URL: jdbc:postgresql://localhost:5432/cms_pruebas
      CMS_TEST_DB_USER: cms
      CMS_TEST_DB_PASSWORD: cms_pruebas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B -ntp clean verify
